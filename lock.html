<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Gear Manufacturing Workshop</title>
<style>
  *{box-sizing:border-box;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:linear-gradient(135deg,#0b1120 0%,#1e293b 100%);color:#fff;padding:24px}
  .box{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
  svg.big{width:64px;height:64px;stroke:#7dd3fc;stroke-width:1.8;fill:none}
  .lt{font-size:1.5rem;font-weight:700}
  .ls{font-size:.85rem;color:#94a3b8}
  input{background:rgba(255,255,255,.06);border:1.5px solid rgba(148,163,184,.3);color:#fff;
        width:min(280px,90vw);text-align:center;padding:12px 16px;font-size:1rem;
        letter-spacing:.15em;border-radius:14px;outline:none}
  input:focus{border-color:#0ea5e9;box-shadow:0 0 0 4px rgba(14,165,233,.2)}
  button{background:linear-gradient(135deg,#0ea5e9,#06b6d4);color:#fff;border:none;border-radius:12px;
         padding:12px 28px;font-weight:600;cursor:pointer;font-size:.9rem}
  button:disabled{opacity:.6;cursor:progress}
  .err{color:#fca5a5;font-size:.82rem;min-height:1.2em}
</style>
</head>
<body>
  <form class="box" id="f">
    <svg class="big" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    <div class="lt">Access Restricted</div>
    <div class="ls">Enter the secret number to continue</div>
    <input type="password" id="code" placeholder="• • • •" inputmode="numeric" autocomplete="off" autofocus>
    <div class="err" id="err"></div>
    <button type="submit" id="btn">Unlock Workshop</button>
  </form>

<script>
  const f    = document.getElementById('f');
  const code = document.getElementById('code');
  const err  = document.getElementById('err');
  const btn  = document.getElementById('btn');

  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.textContent = '';
    btn.disabled = true;
    try {
      const res  = await fetch('/api/unlock', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ code: code.value.trim() })
      });
      const data = await res.json().catch(() => ({}));
      if (res.ok && data.ok) { location.replace('/'); return; }
      err.textContent = data.error || 'Incorrect code.';
      code.value = '';
      code.focus();
    } catch {
      err.textContent = 'Network error. Try again.';
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
